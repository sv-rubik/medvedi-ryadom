name: Publish map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '50 20 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find bear reports and news
        if: github.event_name != 'push'
        run: python scripts/update_news.py
      - name: Search indexed reports for today
        if: github.event_name != 'push'
        run: python scripts/collect_history.py
      - name: Add locatable indexed incidents to the map
        if: github.event_name != 'push'
        run: python scripts/promote_history.py
      - name: Archive report versions
        run: python scripts/export_archive.py
      - name: Save discovered publications and archive
        run: |
          if ! git diff --quiet -- dist/events.json dist/news.json dist/history.json data/geocode-cache.json data/news-archive.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/events.json dist/news.json dist/history.json data/geocode-cache.json data/news-archive.csv
            git commit -m "Update bear reports and news"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
